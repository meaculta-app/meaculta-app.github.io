<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Meaculta</title>
<!--
  ARKADAŞA SOR anket sayfası (ARKADASA_SOR.md). Çerez, localStorage, sessionStorage, analitik, dış yazı tipi YOK.
  Yayın: gizlilik-web ile aynı GitHub Pages deposunda /anket/index.html olarak yüklenir (meaculta-app.github.io/anket/?k=KOD).
  Anahtar yayımlanabilir (publishable) anahtardır; gizli değildir.
-->
<style>
  /* Renkler uygulamanın üç temasından gelir (?t=gece|editoryal|butik); aşağıdaki değerler Gece (varsayılan) */
  :root { --zemin:#12100D; --kutu:#3A0B18; --ust:#3A0B18; --yazi:#F3EBDD; --soluk:#A69A87; --vurgu:#CDA86B; --vurguyazi:#17120B; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--zemin); color:var(--yazi); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.5; }
  main { max-width:560px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:24px; margin:8px 0 18px; text-align:center; }
  /* Kombin kutusu: uygulamadaki gibi bordo (dikey gradyan), parçaların arkasında kutu/zemin YOK */
  .kombin { background:linear-gradient(180deg, var(--ust), var(--kutu)); border-radius:24px; padding:18px 14px 16px; margin-bottom:16px; }
  .etiket { font-weight:700; letter-spacing:.08em; color:var(--vurgu); margin:0 0 10px 6px; }
  .ana { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-bottom:6px; }
  .ana.bir { grid-template-columns:1fr; max-width:60%; margin:0 auto 6px; }
  .ana div { aspect-ratio:3/4; display:flex; align-items:center; justify-content:center; }
  .kucuk { display:flex; gap:4px; justify-content:center; margin-bottom:14px; }
  .kucuk div { width:24%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
  .ana img, .kucuk img { max-width:100%; max-height:100%; object-fit:contain; }
  button { width:100%; border:0; border-radius:999px; padding:14px; font-size:16px; font-weight:700; background:var(--vurgu); color:var(--vurguyazi); cursor:pointer; }
  button:disabled { opacity:.5; }
  .mesaj { text-align:center; font-size:18px; padding:24px 8px; }
  .not { color:var(--soluk); font-size:13px; text-align:center; margin-top:20px; }
</style>
</head>
<body>
<main>
  <h1 id="baslik"></h1>
  <div id="icerik"></div>
  <p class="not" id="not"></p>
</main>
<script>
  // Bu sayfa çerez/yerel depolama KULLANMAZ; oy yalnız bellekte tutulan durumla bir kez gönderilir.
  var SB = 'https://unqdrpjiljdlzzcxbxal.supabase.co/functions/v1/';
  var KEY = 'sb_publishable_yPAm-vbJ2AUGAvfXA_IfYg_78glGrdu';
  var D = {
    tr: ['Sence hangisi daha iyi?','Bunu seç','Teşekkürler! Oyun iletildi.','Bu anketin süresi doldu.','Oyun anonimdir: ad, e-posta, IP adresi ya da çerez toplanmaz. Anket ve görseller 1 saat sonra silinir.','Anket açılamadı. Bağlantıyı kontrol et.'],
    en: ['Which one looks better?','Pick this one','Thanks! Your vote was sent.','This poll has expired.','Your vote is anonymous: no name, email, IP address or cookies are collected. The poll and images are deleted after 1 hour.','Couldn’t open the poll. Check the link.'],
    de: ['Welches Outfit gefällt dir besser?','Dieses wählen','Danke! Deine Stimme wurde gesendet.','Diese Umfrage ist abgelaufen.','Deine Stimme ist anonym: Es werden kein Name, keine E-Mail, keine IP-Adresse und keine Cookies erfasst. Umfrage und Bilder werden nach 1 Stunde gelöscht.','Umfrage konnte nicht geöffnet werden. Prüfe den Link.'],
    es: ['¿Cuál te gusta más?','Elegir este','¡Gracias! Tu voto se ha enviado.','Esta encuesta ha caducado.','Tu voto es anónimo: no se recoge nombre, correo, dirección IP ni cookies. La encuesta y las imágenes se eliminan tras 1 hora.','No se pudo abrir la encuesta. Revisa el enlace.'],
    fr: ['Lequel préférez-vous ?','Choisir celui-ci','Merci ! Votre vote a été envoyé.','Ce sondage a expiré.','Votre vote est anonyme : aucun nom, e-mail, adresse IP ni cookie n’est collecté. Le sondage et les images sont supprimés après 1 heure.','Impossible d’ouvrir le sondage. Vérifiez le lien.'],
    it: ['Quale ti piace di più?','Scegli questo','Grazie! Il tuo voto è stato inviato.','Questo sondaggio è scaduto.','Il tuo voto è anonimo: non raccogliamo nome, e-mail, indirizzo IP né cookie. Sondaggio e immagini vengono eliminati dopo 1 ora.','Impossibile aprire il sondaggio. Controlla il link.'],
    pt: ['Qual você prefere?','Escolher este','Obrigado! Seu voto foi enviado.','Esta enquete expirou.','Seu voto é anônimo: não coletamos nome, e-mail, endereço IP nem cookies. A enquete e as imagens são apagadas após 1 hora.','Não foi possível abrir a enquete. Verifique o link.'],
    ru: ['Какой образ лучше?','Выбрать этот','Спасибо! Ваш голос отправлен.','Срок этого опроса истёк.','Ваш голос анонимен: имя, e-mail, IP-адрес и cookie не собираются. Опрос и изображения удаляются через 1 час.','Не удалось открыть опрос. Проверьте ссылку.'],
    ar: ['أي إطلالة تبدو أفضل؟','اختر هذه','شكرًا! تم إرسال صوتك.','انتهت صلاحية هذا الاستطلاع.','صوتك مجهول: لا نجمع اسمًا ولا بريدًا إلكترونيًا ولا عنوان IP ولا ملفات تعريف ارتباط. يُحذف الاستطلاع والصور بعد ساعة واحدة.','تعذّر فتح الاستطلاع. تحقق من الرابط.'],
    hi: ['कौन-सा बेहतर लगता है?','यह चुनें','धन्यवाद! आपका वोट भेज दिया गया।','इस पोल की अवधि समाप्त हो गई है।','आपका वोट गुमनाम है: नाम, ईमेल, आईपी पता या कुकी एकत्र नहीं होती। पोल और तस्वीरें 1 घंटे बाद हटा दी जाती हैं।','पोल नहीं खुल सका। लिंक जाँचें।'],
    id: ['Mana yang lebih bagus?','Pilih ini','Terima kasih! Suaramu terkirim.','Polling ini sudah berakhir.','Suaramu anonim: tidak ada nama, email, alamat IP, atau cookie yang dikumpulkan. Polling dan gambar dihapus setelah 1 jam.','Polling tidak dapat dibuka. Periksa tautannya.'],
    ja: ['どちらが良いと思う？','こちらを選ぶ','ありがとう！投票を送信しました。','このアンケートは終了しました。','投票は匿名です。名前、メール、IPアドレス、Cookieは収集しません。アンケートと画像は1時間後に削除されます。','アンケートを開けませんでした。リンクを確認してください。'],
    ko: ['어느 쪽이 더 좋아요?','이걸로 선택','고마워요! 투표가 전송됐어요.','이 투표는 종료되었어요.','투표는 익명입니다. 이름, 이메일, IP 주소, 쿠키를 수집하지 않아요. 투표와 이미지는 1시간 후 삭제돼요.','투표를 열 수 없어요. 링크를 확인해 주세요.'],
    zh: ['你觉得哪套更好？','选这套','谢谢！你的投票已发送。','此投票已过期。','你的投票是匿名的：不收集姓名、邮箱、IP 地址或 Cookie。投票和图片将在 1 小时后删除。','无法打开投票，请检查链接。'],
    pl: ['Która wygląda lepiej?','Wybierz tę','Dziękujemy! Twój głos został wysłany.','Ta ankieta wygasła.','Twój głos jest anonimowy: nie zbieramy imienia, e-maila, adresu IP ani plików cookie. Ankieta i obrazy są usuwane po 1 godzinie.','Nie udało się otworzyć ankiety. Sprawdź link.']
  };
  var q = new URLSearchParams(location.search);
  var dil = (q.get('dil') || navigator.language || 'en').toLowerCase().split('-')[0];
  var T = D[dil] || D.en;
  // Tema: link ?t=gece|editoryal|butik taşır (uygulama kullanıcının temasını ekler); bilinmiyorsa Gece
  var TEMALAR = {
    gece: { zemin: '#12100D', kutu: '#3A0B18', ust: '#3A0B18', yazi: '#F3EBDD', soluk: '#A69A87', vurgu: '#CDA86B', vurguyazi: '#17120B' },
    editoryal: { zemin: '#EFE5D2', kutu: '#5A4432', ust: '#7A6248', yazi: '#33271D', soluk: '#5A4432', vurgu: '#D8B98A', vurguyazi: '#33271D' },
    butik: { zemin: '#F3E4E0', kutu: '#4F3536', ust: '#6E4F50', yazi: '#2E1E20', soluk: '#6E4F50', vurgu: '#C9A39C', vurguyazi: '#2E1E20' }
  };
  var tema = TEMALAR[q.get('t')] || TEMALAR.gece;
  Object.keys(tema).forEach(function (k) { document.documentElement.style.setProperty('--' + k, tema[k]); });
  document.documentElement.lang = D[dil] ? dil : 'en';
  if (dil === 'ar') document.documentElement.dir = 'rtl';
  var kod = q.get('k') || '';
  var icerik = document.getElementById('icerik');
  document.getElementById('baslik').textContent = T[0];
  document.getElementById('not').textContent = T[4];

  function mesaj(metin) { icerik.innerHTML = ''; var p = document.createElement('p'); p.className = 'mesaj'; p.textContent = metin; icerik.appendChild(p); document.getElementById('baslik').textContent = ''; }
  function cagir(yol, govde) {
    return fetch(SB + yol, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify(govde), credentials: 'omit', referrerPolicy: 'no-referrer' });
  }
  var ANA = ['dis_giyim', 'ust', 'elbise', 'alt']; // büyük gösterilenler; ayakkabı ve aksesuar küçük şeritte (uygulamadaki kombin kutusu gibi)
  function resim(p) {
    var d = document.createElement('div'); var i = document.createElement('img');
    i.src = p.u; i.alt = ''; i.referrerPolicy = 'no-referrer'; d.appendChild(i); return d;
  }
  function kombin(harf, gorseller, oyVer) {
    var kutu = document.createElement('section'); kutu.className = 'kombin';
    var e = document.createElement('p'); e.className = 'etiket'; e.textContent = harf; kutu.appendChild(e);
    var liste = gorseller.map(function (g) { return typeof g === 'string' ? { u: g, t: 'ust' } : g; });
    var ana = liste.filter(function (p) { return ANA.indexOf(p.t) !== -1; });
    var kucuk = liste.filter(function (p) { return ANA.indexOf(p.t) === -1; });
    if (!ana.length) { ana = kucuk; kucuk = []; }
    var ag = document.createElement('div'); ag.className = 'ana' + (ana.length === 1 ? ' bir' : '');
    ana.forEach(function (p) { ag.appendChild(resim(p)); }); kutu.appendChild(ag);
    if (kucuk.length) { var kg = document.createElement('div'); kg.className = 'kucuk'; kucuk.forEach(function (p) { kg.appendChild(resim(p)); }); kutu.appendChild(kg); }
    var b = document.createElement('button'); b.textContent = T[1] + ' (' + harf + ')'; b.onclick = function () { oyVer(harf); }; kutu.appendChild(b);
    return kutu;
  }

  if (!/^[A-Za-z0-9_-]{16,64}$/.test(kod)) { mesaj(T[3]); }
  else {
    cagir('anket-goster', { kod: kod }).then(function (r) {
      if (r.status === 404) { mesaj(T[3]); return null; }
      if (!r.ok) { mesaj(T[5]); return null; }
      return r.json();
    }).then(function (veri) {
      if (!veri) return;
      var oyVerildi = false;
      function oyVer(secim) {
        if (oyVerildi) return; oyVerildi = true;
        Array.prototype.forEach.call(document.querySelectorAll('button'), function (b) { b.disabled = true; });
        cagir('anket-oy', { kod: kod, secim: secim }).then(function (r) {
          if (r.ok) mesaj(T[2]); else if (r.status === 404) mesaj(T[3]); else mesaj(T[5]);
        }).catch(function () { mesaj(T[5]); });
      }
      var secenekler = veri.secenekler || [veri.a, veri.b]; // 2-4 kombin (eski anketlerde a/b)
      secenekler.forEach(function (g, i) { icerik.appendChild(kombin('ABCD'.charAt(i), g, oyVer)); });
    }).catch(function () { mesaj(T[5]); });
  }
</script>
</body>
</html>
